name: shopresolve
services:
  mysql:
    image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
    environment:
      MYSQL_DATABASE: shopresolve
      MYSQL_USER: shopresolve
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:13316:3306"
    volumes:
      - shopresolve_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.5
    ports:
      - "127.0.0.1:16379:6379"
    # M1 does not use Redis yet. This is reserved for M3 task notifications.
    profiles: [queue]
volumes:
  shopresolve_mysql:
