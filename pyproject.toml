[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shopresolve"
version = "0.1.0"
description = "Versioned document workbench with a durable agent harness and controlled publication"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1", "alembic>=1.15,<2", "asyncmy>=0.2.10,<0.3",
  "cryptography>=44,<50",
  "httpx>=0.28,<1", "redis>=5.2,<8", "numpy>=2.1,<3", "rank-bm25>=0.2.2,<0.3",
]

[project.optional-dependencies]
retrieval = ["fastembed>=0.9,<1"]
benchmark = ["pytrec-eval-terrier==0.5.11", "pyarrow==21.0.0"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "aiosqlite>=0.21,<1", "ruff>=0.11,<1"]

[project.scripts]
shopresolve = "shopresolve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["mysql: requires a dedicated MySQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
